name: pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: release
    uses: guilhermelinosp/templates/.github/workflows/release.yml@df9f66533749a4a3a4b59c18a828a179800de096
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit
    permissions:
      contents: write
